<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[UNTITLED] TOOLS</title>
<style>
:root{color-scheme:dark}
body{font:15px system-ui,Segoe UI,sans-serif;background:#111;color:#e8e8e8;margin:0;padding:24px;max-width:860px}
h1{font-size:20px;letter-spacing:.08em;margin:0 0 16px}
label{display:block;margin:12px 0 4px;color:#aaa}
textarea,input[type=text],input[type=password],select{width:100%;box-sizing:border-box;background:#1b1b1b;color:#eee;border:1px solid #333;border-radius:6px;padding:8px;font:inherit}
textarea{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row label{margin:0;display:flex;gap:6px;align-items:center;color:#ddd}
button{background:#2d6cdf;color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;cursor:pointer}
button.alt{background:#2a2a2a}button:disabled{opacity:.45;cursor:default}
pre{background:#0b0b0b;border:1px solid #2a2a2a;border-radius:6px;padding:10px;height:320px;overflow:auto;white-space:pre-wrap;font-size:12.5px}
small{color:#888}
</style></head><body>
<h1>[UNTITLED] TOOLS</h1>
<label>untitled.stream project links (one per line)</label>
<textarea id="urls" placeholder="https://untitled.stream/library/project/..."></textarea>
<label>Output folder (full path on the computer running this app)</label>
<input type="text" id="folder" placeholder="C:\Users\you\Music\untitled">
<div class="row">
  <select id="mode" style="width:auto"><option value="mp3">MP3 only</option><option value="original">Original file only</option><option value="both">MP3 + original</option></select>
  <label><input type="checkbox" id="sub" checked> Folder per project</label>
  <label><input type="checkbox" id="meta"> Metadata only</label>
  <label><input type="checkbox" id="nd"> I have permission for tracks the owner marked not downloadable</label>
  <label><input type="checkbox" id="ub" checked> Use background browser</label>
  <label><input type="checkbox" id="sw"> Show browser window (to log in / watch it)</label>
  <label><input type="checkbox" id="uc"> Use the browser's login session for downloads (this run only)</label>
</div>
<details style="margin-top:10px"><summary>Advanced</summary>
<label>Access token (optional, kept in memory only, never saved)</label>
<input type="password" id="tok" autocomplete="off"></details>
<div class="row">
  <button id="go">Download</button><button class="alt" id="pv">Preview (saves nothing)</button><button class="alt" id="cx">Cancel</button>
</div>
<p><small>Saved: audio + title/length/BPM/key/format info. Never saved: usernames, emails, profile pictures, account IDs, tokens.</small></p>
<pre id="log"></pre>
<script>
const TOKEN="__TOKEN__";let next=0;
const $=id=>document.getElementById(id);
async function api(p,body){
  const o={headers:{'X-Token':TOKEN}};
  if(body){o.method='POST';o.body=JSON.stringify(body);o.headers['Content-Type']='application/json';}
  const r=await fetch(p,o);return r.json();
}
async function start(preview){
  const urls=$('urls').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const r=await api('/api/run',{urls,preview,folder:$('folder').value,mode:$('mode').value,
    subfolder:$('sub').checked,metadata_only:$('meta').checked,allow_nd:$('nd').checked,use_browser:$('ub').checked,show_window:$('sw').checked,use_cookies:$('uc').checked,token:$('tok').value});
  if(r.error){$('log').textContent+='ERROR: '+r.error+'\n';}
}
$('go').onclick=()=>start(false);$('pv').onclick=()=>start(true);
$('cx').onclick=()=>api('/api/cancel',{});
async function poll(){
  try{
    const r=await api('/api/status?since='+next);
    if(r.lines&&r.lines.length){$('log').textContent+=r.lines.join('\n')+'\n';$('log').scrollTop=1e9;}
    if(typeof r.next==='number')next=r.next;
    $('go').disabled=$('pv').disabled=!!r.busy;
  }catch(e){}
  setTimeout(poll,800);
}
poll();
</script></body></html>
